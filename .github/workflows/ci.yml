name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Check documented examples and test fixtures are formatted
        run: python YubaLANG.py fmt --check examples tests/cases

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name YubaLANG YubaLANG.py
      - name: Smoke test bundled executable
        run: |
          ./dist/YubaLANG test tests/cases
          ./dist/YubaLANG fmt --check examples
          python tools/smoke_release.py dist/YubaLANG
          python tools/smoke_lsp.py dist/YubaLANG

  yubapkg-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yubalang/YubaPKG
          ref: main
          path: YubaPKG
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YubaPKG checkout
        run: python -m pip install --editable ./YubaPKG
      - name: Install registry dependency graph and verify YubaLANG imports
        run: python -m unittest discover -s tests -p integration_yubapkg.py -v
