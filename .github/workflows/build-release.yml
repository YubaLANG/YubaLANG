name: Build and release YubaLANG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            asset: YubaLANG-windows-x64.zip
          - runner: ubuntu-22.04
            asset: YubaLANG-linux-x64.tar.gz
          - runner: macos-15-intel
            asset: YubaLANG-macos-x64.tar.gz
          - runner: macos-15
            asset: YubaLANG-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4
      - name: Set source timestamp for reproducible builds
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name YubaLANG YubaLANG.py
      - name: Save first Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/YubaLANG.exe "$env:RUNNER_TEMP/YubaLANG-first.exe"
      - name: Rebuild and compare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name YubaLANG YubaLANG.py
          $first = (Get-FileHash "$env:RUNNER_TEMP/YubaLANG-first.exe" -Algorithm SHA256).Hash
          $second = (Get-FileHash dist/YubaLANG.exe -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "Repeated Windows builds do not match." }
      - name: Save first macOS or Linux build
        if: runner.os != 'Windows'
        shell: bash
        run: cp dist/YubaLANG "$RUNNER_TEMP/YubaLANG-first"
      - name: Rebuild and compare macOS or Linux executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name YubaLANG YubaLANG.py
          cmp "$RUNNER_TEMP/YubaLANG-first" dist/YubaLANG
      - name: Smoke test bundled executable on Windows
        if: runner.os == 'Windows'
        run: |
          .\dist\YubaLANG.exe test tests\cases
          .\dist\YubaLANG.exe fmt --check examples
          python tools/smoke_release.py dist/YubaLANG.exe
          python tools/smoke_lsp.py dist/YubaLANG.exe
      - name: Smoke test bundled executable on macOS or Linux
        if: runner.os != 'Windows'
        run: |
          ./dist/YubaLANG test tests/cases
          ./dist/YubaLANG fmt --check examples
          python tools/smoke_release.py dist/YubaLANG
          python tools/smoke_lsp.py dist/YubaLANG
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          python tools/package_release.py --binary dist/YubaLANG.exe --output "release/${{ matrix.asset }}" --format zip --source-date-epoch "$env:SOURCE_DATE_EPOCH"
      - name: Package macOS or Linux executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          python tools/package_release.py --binary dist/YubaLANG --output "release/${{ matrix.asset }}" --format tar.gz --source-date-epoch "$SOURCE_DATE_EPOCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum YubaLANG-* > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          release_version="${release_tag#v}"
          release_series="${release_version%.*}"
          notes_file="docs/${release_series}-release-notes.md"
          test -f "$notes_file"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title "$release_tag" --notes-file "$notes_file"
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title "$release_tag" --notes-file "$notes_file"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/YubaLANG-* release-assets/SHA256SUMS \
            "$notes_file" --clobber
